[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "owlmatic"
version = "0.1.0"
description = "Executable memory for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5", "referencing>=0.35,<1", "pydantic>=2.11,<3", "mcp>=1.20,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1.2", "mypy>=1.15", "types-PyYAML", "types-jsonschema"]

[project.scripts]
owlmatic = "owlmatic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/owlmatic"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scenarios", "skills", "benchmark", "docs", "contracts", "config", "README.md", "LICENSE", "CONTRIBUTING.md", "pyproject.toml", "requirements-dev.lock"]

[tool.hatch.build.targets.wheel.force-include]
"skills/owlmatic" = "owlmatic/resources/skill"
"examples" = "owlmatic/resources/examples"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/owlmatic", "tests", "benchmark", "scenarios"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
