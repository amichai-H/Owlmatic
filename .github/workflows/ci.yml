name: Python quality
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OWLMATIC_HOME: ${{ github.workspace }}/.owlmatic-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests examples benchmark scenarios
      - run: python -m ruff format --check src tests examples benchmark scenarios
      - run: python -m mypy
      - run: python -m scenarios.deploy_monitor.live_check
      - run: python -m pytest -q
      - run: python -m build
      - name: Check installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/owlmatic-wheel"
          "$RUNNER_TEMP/owlmatic-wheel/bin/python" -m pip install dist/*.whl
          cp tests/wheel_smoke.py "$RUNNER_TEMP/owlmatic-wheel-smoke.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/owlmatic-wheel/bin/python" -I owlmatic-wheel-smoke.py
