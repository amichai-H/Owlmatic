{
  "schema_version": 1,
  "id": "example.bootstrap",
  "version": "1.0.0",
  "description": "Bootstrap and verify a disposable SQLite environment",
  "owner": "owlmatic-examples",
  "entrypoint": [
    "python3",
    "run.py"
  ],
  "input_schema": "input.schema.json",
  "output_schema": "output.schema.json",
  "environments": [
    "simulation"
  ],
  "effects": [
    "writes example database in workspace"
  ],
  "execution": {
    "timeout_seconds": 15
  },
  "verification": {
    "required_checks": [
      "schema_ready"
    ]
  },
  "tests": [
    {
      "inputs": {
        "healthy": true
      },
      "outcome": "pass"
    },
    {
      "inputs": {
        "healthy": false
      },
      "outcome": "fail"
    }
  ]
}
